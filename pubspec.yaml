name: ca_inter_tracker
description: A private, locally stored CA Inter study tracker with lecture tracking, revision notes, charts, and scheduled reminders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  vibration: ^3.1.8
  audioplayers: ^6.7.1
  http: ^1.2.2
  url_launcher: ^6.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  archive: ^4.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/study_tracker_logo.png
    - assets/audio/study_alarm.wav
